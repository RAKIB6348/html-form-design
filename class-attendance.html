<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Attendance Form</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      background: #f3f5f7;
      color: #202a35;
      font-family: Arial, Helvetica, sans-serif;
    }

    .form-container {
      width: min(100%, 1000px);
      margin: 0 auto;
      padding: 32px;
      background: #fff;
      border: 1px solid #d5dbe1;
      border-radius: 0;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
    }

    .form-intro {
      margin: 0 0 28px;
      color: #5d6874;
      text-align: center;
      line-height: 1.5;
    }

    .form-section {
      margin: 28px 0;
      padding: 20px;
      border: 1px solid #d5dbe1;
      border-radius: 0;
    }

    .form-section h2 {
      margin: 0 0 20px;
      font-size: 19px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px 18px;
    }

    .form-group {
      position: relative;
      min-width: 0;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      display: block;
      width: 100%;
      min-height: 52px;
      padding: 18px 12px 8px;
      border: 1px solid #aab3bd;
      border-radius: 0;
      background: #fff;
      color: #202a35;
      font: inherit;
      outline: none;
    }

    .form-group select {
      padding-top: 19px;
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .form-group label {
      position: absolute;
      top: 16px;
      left: 12px;
      z-index: 1;
      padding: 0 3px;
      background: #fff;
      color: #687482;
      font-size: 14px;
      pointer-events: none;
      transition: top 0.15s ease, font-size 0.15s ease, color 0.15s ease;
    }

    .form-group:focus-within label,
    .form-group.has-value label {
      top: -7px;
      color: #1558a6;
      font-size: 12px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #1558a6;
      box-shadow: 0 0 0 1px #1558a6;
    }

    .form-group input[type="date"],
    .form-group input[type="time"] {
      padding-top: 19px;
    }

    .form-group input[type="date"] + label,
    .form-group input[type="time"] + label {
      top: -7px;
      font-size: 12px;
    }

    .attendance-table-wrap {
      overflow-x: auto;
    }

    .attendance-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 0;
    }

    .attendance-table th,
    .attendance-table td {
      padding: 12px;
      border: 1px solid #d5dbe1;
      text-align: left;
      vertical-align: middle;
    }

    .attendance-table th {
      background: #eef2f6;
      font-weight: 600;
    }

    .attendance-table input[type="text"],
    .attendance-table select {
      width: 100%;
      min-width: 120px;
      min-height: 40px;
      padding: 8px;
      border: 1px solid #aab3bd;
      border-radius: 0;
      background: #fff;
      color: #202a35;
      font: inherit;
    }

    .attendance-table input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #1558a6;
    }

    .student-name-input {
      min-width: 180px !important;
    }

    .table-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      min-height: 42px;
      padding: 10px 16px;
      border: 1px solid #1558a6;
      border-radius: 0;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.88;
    }

    .secondary-button {
      background: #fff;
      color: #1558a6;
    }

    .submit-button {
      background: #1558a6;
      color: #fff;
    }

    .reset-button {
      background: #fff;
      color: #1558a6;
    }

    .button-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    .summary {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid #d5dbe1;
      background: #f8fafc;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px 10px;
      }

      .form-container {
        padding: 20px 14px;
      }

      .form-section {
        padding: 16px 12px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full-width {
        grid-column: auto;
      }

      .button-row {
        flex-direction: column-reverse;
      }

      .button-row button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="form-container">
    <h1>Class Attendance Form</h1>
    <p class="form-intro">Enter the class details and mark each student's attendance.</p>

    <form id="attendanceForm">
      <section class="form-section">
        <h2>Class Details</h2>

        <div class="form-grid">
          <div class="form-group">
            <input type="date" id="attendanceDate" name="attendanceDate" required>
            <label for="attendanceDate">Attendance Date</label>
          </div>

          <div class="form-group">
            <select id="className" name="className" required>
              <option value="" selected disabled></option>
              <option>Nursery</option>
              <option>Kindergarten</option>
              <option>Class 1</option>
              <option>Class 2</option>
              <option>Class 3</option>
              <option>Class 4</option>
              <option>Class 5</option>
              <option>Class 6</option>
              <option>Class 7</option>
              <option>Class 8</option>
              <option>Class 9</option>
              <option>Class 10</option>
              <option>Class 11</option>
              <option>Class 12</option>
            </select>
            <label for="className">Class</label>
          </div>

          <div class="form-group">
            <select id="section" name="section" required>
              <option value="" selected disabled></option>
              <option>Section A</option>
              <option>Section B</option>
              <option>Section C</option>
              <option>Section D</option>
            </select>
            <label for="section">Section</label>
          </div>

          <div class="form-group">
            <input type="text" id="subject" name="subject" placeholder=" ">
            <label for="subject">Subject</label>
          </div>

          <div class="form-group">
            <input type="text" id="teacherName" name="teacherName" placeholder=" " required>
            <label for="teacherName">Teacher's Name</label>
          </div>

          <div class="form-group">
            <input type="time" id="classTime" name="classTime">
            <label for="classTime">Class Time</label>
          </div>
        </div>
      </section>

      <section class="form-section">
        <h2>Student Attendance</h2>

        <div class="attendance-table-wrap">
          <table class="attendance-table">
            <thead>
              <tr>
                <th scope="col">No.</th>
                <th scope="col">Student Name</th>
                <th scope="col">Student ID</th>
                <th scope="col">Attendance Status</th>
                <th scope="col">Late</th>
              </tr>
            </thead>
            <tbody id="studentRows">
              <tr>
                <td>1</td>
                <td>
                  <input class="student-name-input" type="text"
                         name="studentName[]" placeholder="Student name" required>
                </td>
                <td>
                  <input type="text" name="studentId[]" placeholder="Student ID">
                </td>
                <td>
                  <select name="attendanceStatus[]" required>
                    <option value="Present" selected>Present</option>
                    <option value="Absent">Absent</option>
                    <option value="Excused">Excused</option>
                  </select>
                </td>
                <td>
                  <input type="checkbox" name="late[]" aria-label="Mark student as late">
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="table-actions">
          <button type="button" class="secondary-button" id="addStudentButton">
            Add Student
          </button>
          <button type="button" class="secondary-button" id="markAllPresentButton">
            Mark All Present
          </button>
        </div>

        <div class="summary" id="attendanceSummary" aria-live="polite">
          Students: 1 | Present: 1 | Absent: 0 | Excused: 0
        </div>
      </section>

      <section class="form-section">
        <h2>Additional Notes</h2>
        <div class="form-grid">
          <div class="form-group full-width">
            <textarea id="notes" name="notes" placeholder=" "></textarea>
            <label for="notes">Notes or Comments</label>
          </div>
        </div>
      </section>

      <div class="button-row">
        <button type="reset" class="reset-button">Reset Form</button>
        <button type="submit" class="submit-button">Submit Attendance</button>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById("attendanceForm");
    const studentRows = document.getElementById("studentRows");
    const summary = document.getElementById("attendanceSummary");

    function updateFloatingLabel(field) {
      const group = field.closest(".form-group");
      if (!group) return;

      group.classList.toggle("has-value", field.value.trim() !== "");
    }

    function updateRowNumbers() {
      [...studentRows.rows].forEach((row, index) => {
        row.cells[0].textContent = index + 1;
      });
    }

    function updateSummary() {
      const statuses = [...studentRows.querySelectorAll('select[name="attendanceStatus[]"]')];
      const present = statuses.filter((select) => select.value === "Present").length;
      const absent = statuses.filter((select) => select.value === "Absent").length;
      const excused = statuses.filter((select) => select.value === "Excused").length;

      summary.textContent =
        `Students: ${statuses.length} | Present: ${present} | Absent: ${absent} | Excused: ${excused}`;
    }

    function addStudentRow() {
      const row = studentRows.insertRow();
      row.innerHTML = `
        <td></td>
        <td>
          <input class="student-name-input" type="text"
                 name="studentName[]" placeholder="Student name" required>
        </td>
        <td>
          <input type="text" name="studentId[]" placeholder="Student ID">
        </td>
        <td>
          <select name="attendanceStatus[]" required>
            <option value="Present" selected>Present</option>
            <option value="Absent">Absent</option>
            <option value="Excused">Excused</option>
          </select>
        </td>
        <td>
          <input type="checkbox" name="late[]" aria-label="Mark student as late">
          <button type="button" class="remove-row-button" aria-label="Remove student row">Remove</button>
        </td>
      `;

      updateRowNumbers();
      updateSummary();
    }

    document.getElementById("addStudentButton").addEventListener("click", addStudentRow);

    document.getElementById("markAllPresentButton").addEventListener("click", () => {
      studentRows.querySelectorAll('select[name="attendanceStatus[]"]').forEach((select) => {
        select.value = "Present";
      });
      updateSummary();
    });

    studentRows.addEventListener("change", (event) => {
      if (event.target.matches('select[name="attendanceStatus[]"]')) {
        updateSummary();
      }
    });

    studentRows.addEventListener("click", (event) => {
      if (event.target.matches(".remove-row-button")) {
        event.target.closest("tr").remove();
        updateRowNumbers();
        updateSummary();
      }
    });

    form.querySelectorAll(".form-group input, .form-group select, .form-group textarea")
      .forEach((field) => {
        updateFloatingLabel(field);
        field.addEventListener("input", () => updateFloatingLabel(field));
        field.addEventListener("change", () => updateFloatingLabel(field));
      });

    form.addEventListener("reset", () => {
      setTimeout(() => {
        form.querySelectorAll(".form-group input, .form-group select, .form-group textarea")
          .forEach(updateFloatingLabel);

        updateRowNumbers();
        updateSummary();
      }, 0);
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      alert("Attendance form is ready. Connect it to a backend to save attendance records.");
    });

    updateSummary();
  </script>
</body>
</html>
