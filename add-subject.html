<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Subject</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      font-family: Arial, sans-serif;
      color: #202938;
      background: #f3f5f8;
    }

    .form-container {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 28px;
      background: #fff;
      border: 1px solid #d5dbe3;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.7rem;
    }

    .description {
      margin: 0 0 24px;
      color: #5d6878;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .field {
      position: relative;
      min-width: 0;
    }

    .field.full-width {
      grid-column: 1 / -1;
    }

    .field input,
    .field select,
    .field textarea {
      display: block;
      width: 100%;
      min-height: 54px;
      padding: 20px 12px 8px;
      border: 1px solid #aeb8c5;
      border-radius: 0;
      background: #fff;
      color: #202938;
      font: inherit;
      outline: none;
    }

    .field textarea {
      min-height: 120px;
      resize: vertical;
    }

    .field label {
      position: absolute;
      top: 17px;
      left: 12px;
      padding: 0 3px;
      color: #687587;
      background: #fff;
      pointer-events: none;
      transition: top 0.15s ease, font-size 0.15s ease, color 0.15s ease;
    }

    .field:focus-within label,
    .field.has-value label {
      top: -8px;
      color: #155eef;
      font-size: 0.78rem;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #155eef;
    }

    .field input[type="date"],
    .field input[type="number"] {
      padding-top: 20px;
    }

    .hint {
      margin: 6px 0 0;
      color: #687587;
      font-size: 0.82rem;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      min-height: 44px;
      padding: 10px 18px;
      border: 1px solid #155eef;
      border-radius: 0;
      font: inherit;
      cursor: pointer;
    }

    .submit-button {
      background: #155eef;
      color: #fff;
    }

    .reset-button {
      background: #fff;
      color: #202938;
      border-color: #aeb8c5;
    }

    @media (max-width: 600px) {
      .form-container {
        padding: 20px 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full-width {
        grid-column: auto;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="form-container">
    <h1>Add Subject</h1>
    <p class="description">Enter the subject details below.</p>

    <form id="subjectForm">
      <div class="form-grid">
        <div class="field">
          <input
            type="text"
            id="subjectName"
            name="subjectName"
            placeholder=" "
            required
          >
          <label for="subjectName">Subject Name</label>
        </div>

        <div class="field">
          <input
            type="text"
            id="subjectCode"
            name="subjectCode"
            placeholder=" "
            required
          >
          <label for="subjectCode">Subject Code</label>
        </div>

        <div class="field">
          <select id="gradeLevel" name="gradeLevel" required>
            <option value="" selected></option>
            <option value="Grade 1">Grade 1</option>
            <option value="Grade 2">Grade 2</option>
            <option value="Grade 3">Grade 3</option>
            <option value="Grade 4">Grade 4</option>
            <option value="Grade 5">Grade 5</option>
            <option value="Grade 6">Grade 6</option>
            <option value="Grade 7">Grade 7</option>
            <option value="Grade 8">Grade 8</option>
            <option value="Grade 9">Grade 9</option>
            <option value="Grade 10">Grade 10</option>
            <option value="Grade 11">Grade 11</option>
            <option value="Grade 12">Grade 12</option>
          </select>
          <label for="gradeLevel">Grade Level</label>
        </div>

        <div class="field">
          <select id="subjectType" name="subjectType" required>
            <option value="" selected></option>
            <option value="Core">Core</option>
            <option value="Elective">Elective</option>
            <option value="Optional">Optional</option>
          </select>
          <label for="subjectType">Subject Type</label>
        </div>

        <div class="field">
          <input
            type="number"
            id="weeklyPeriods"
            name="weeklyPeriods"
            min="1"
            max="20"
            placeholder=" "
            required
          >
          <label for="weeklyPeriods">Periods per Week</label>
        </div>

        <div class="field">
          <input
            type="text"
            id="academicYear"
            name="academicYear"
            placeholder=" "
          >
          <label for="academicYear">Academic Year</label>
        </div>

        <div class="field full-width">
          <textarea
            id="description"
            name="description"
            placeholder=" "
          ></textarea>
          <label for="description">Subject Description</label>
        </div>

        <div class="field">
          <select id="status" name="status" required>
            <option value="Active" selected>Active</option>
            <option value="Inactive">Inactive</option>
          </select>
          <label for="status">Status</label>
        </div>
      </div>

      <div class="actions">
        <button class="submit-button" type="submit">Add Subject</button>
        <button class="reset-button" type="reset">Clear Form</button>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById("subjectForm");
    const fields = form.querySelectorAll("input, select, textarea");

    function updateField(field) {
      const wrapper = field.closest(".field");
      if (!wrapper) return;

      const hasValue = field.type === "file"
        ? field.files.length > 0
        : field.value.trim() !== "";

      wrapper.classList.toggle("has-value", hasValue);
    }

    fields.forEach((field) => {
      field.addEventListener("input", () => updateField(field));
      field.addEventListener("change", () => updateField(field));
      updateField(field);
    });

    form.addEventListener("reset", () => {
      requestAnimationFrame(() => fields.forEach(updateField));
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (!form.reportValidity()) return;

      alert("Subject added successfully.");
      form.reset();
    });
  </script>
</body>
</html>
